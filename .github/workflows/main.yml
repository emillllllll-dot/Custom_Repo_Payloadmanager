name: Update HyperHEN latest release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update payloads.json from the official latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime, timezone

          api = "https://api.github.com/repos/Michele-M-Media/HYPERHEN/releases/latest"
          req = urllib.request.Request(
              api,
              headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "HyperHEN-PLDMGR-Custom-Repo"
              }
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)

          assets = release.get("assets", [])
          candidates = [
              asset for asset in assets
              if asset.get("name", "").lower().endswith(".elf")
              and "hyperhen" in asset.get("name", "").lower()
              and "bypervisor" not in asset.get("name", "").lower()
          ]
          if not candidates:
              raise SystemExit(
                  "No HyperHEN ELF asset found in the latest release. "
                  "Check the official release asset naming before publishing."
              )

          # Prefer the official versioned HyperHEN ELF, not source archives or Bypervisor.
          asset = sorted(
              candidates,
              key=lambda a: (
                  "hyperhen" in a["name"].lower(),
                  a.get("size", 0) > 0
              ),
              reverse=True
          )[0]

          version = release.get("tag_name", "").replace("HYPERHEN_V", "").replace("_", ".")
          version = version.lstrip("vV") or release.get("tag_name", "latest")
          published = release.get("published_at") or datetime.now(timezone.utc).isoformat()
          date = published[:10]

          path = "payloads.json"
          with open(path, "r", encoding="utf-8") as f:
              catalog = json.load(f)

          item = next(p for p in catalog["payloads"] if p.get("id") == "hyperhen")
          item["name"] = f"HyperHEN {release.get('tag_name', version)}"
          item["filename"] = asset["name"]
          item["url"] = asset["browser_download_url"]
          item["version"] = version
          item["last_update"] = date
          item["description"] = (
              f"Offizielles HyperHEN-Release {release.get('tag_name', version)}. "
              "Firmware-Kompatibilität und Installationsreihenfolge vor dem Start "
              "in den offiziellen Release-Hinweisen prüfen."
          )
          item["details_url"] = release.get("html_url", "https://github.com/Michele-M-Media/HYPERHEN/releases/latest")
          item["source"] = "https://github.com/Michele-M-Media/HYPERHEN"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)
              f.write("\\n")
          print(f"Updated to {item['name']} using asset {asset['name']}")
          PY

      - name: Commit updated catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payloads.json
          if git diff --cached --quiet; then
            echo "Catalog already up to date."
          else
            git commit -m "Update HyperHEN catalog to latest release"
            git push
          fi
