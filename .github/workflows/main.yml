name: Update HyperHEN latest release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest official HyperHEN release and update manifest
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          api = "https://api.github.com/repos/Michele-M-Media/HYPERHEN/releases/latest"
          req = urllib.request.Request(api, headers={
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "HyperHEN-PLDMGR-Custom-Repo"
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)

          assets = release.get("assets", [])
          candidates = [
              asset for asset in assets
              if asset.get("name", "").lower().endswith(".elf")
              and "hyperhen" in asset.get("name", "").lower()
              and "bypervisor" not in asset.get("name", "").lower()
          ]
          if not candidates:
              print("Latest release:", release.get("tag_name"))
              print("Available assets:", [a.get("name") for a in assets])
              raise SystemExit("No HyperHEN .elf asset found; manifest was not changed.")

          asset = sorted(candidates, key=lambda a: a.get("size", 0), reverse=True)[0]
          published = release.get("published_at") or datetime.now(timezone.utc).isoformat()
          tag = release.get("tag_name", "latest")
          version = tag.replace("HYPERHEN_V", "").replace("_", ".").lstrip("vV") or tag

          with open("payloads.json", "r", encoding="utf-8") as f:
              catalog = json.load(f)

          item = next(p for p in catalog["payloads"] if p.get("id") == "hyperhen")
          item["name"] = f"HyperHEN {tag}"
          item["filename"] = asset["name"]
          item["url"] = asset["browser_download_url"]
          item["version"] = version
          item["last_update"] = published[:10]
          item["description"] = (
              f"Official HyperHEN release {tag}. Check the official release notes "
              "for exact PS5 firmware compatibility and startup order before use."
          )
          item["details_url"] = release.get(
              "html_url", "https://github.com/Michele-M-Media/HYPERHEN/releases/latest"
          )
          item["source"] = "https://github.com/Michele-M-Media/HYPERHEN"

          with open("payloads.json", "w", encoding="utf-8") as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"Manifest updated: {tag} -> {asset['browser_download_url']}")
          PY

      - name: Commit manifest only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payloads.json
          if git diff --cached --quiet; then
            echo "Catalog already up to date."
          else
            git commit -m "Update HyperHEN catalog to latest release"
            git push
          fi
